<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灰度决断</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101012; overflow: hidden; }
    #unity-canvas { display: block; width: 100vw; height: 100vh; background: #101012; outline: none; }
    /* 游戏里的鼠标图是 128 像素，桌面系统会缩小，浏览器按原尺寸显示就特别大（迈队 10/28）。
       Unity 网页版不认运行时换光标，所以这里直接用 32 像素的同款压住 Unity 写的样式。 */
    #unity-canvas { cursor: url("cursor.png") 0 0, default !important; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      color: #d8d8dc; font: 16px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #loading h1 { margin: 0; font-size: 28px; letter-spacing: 6px; font-weight: 600; }
    #bar { width: min(360px, 70vw); height: 6px; background: #2a2a30; border-radius: 3px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #e6e6ea; transition: width .2s; }
    #hint { color: #8a8a92; font-size: 13px; text-align: center; padding: 0 16px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>灰度决断</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="hint">加载中 0%　第一次打开要下载一阵，之后会快很多。请用电脑浏览器打开。</div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/web.data.unityweb",
      frameworkUrl: buildUrl + "/web.framework.js.unityweb",
      codeUrl: buildUrl + "/web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "3GS",
      productVersion: "1.0",
    };
    // 游戏的 CRT 画面输出时透明度写得很低，桌面版不管透明度，网页却会透出页面底色（地图整片发黑）。
    // Unity 不让设画布的 alpha，这里在它创建 WebGL 画布时强制成不透明。
    var getContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, attributes) {
      if (this.id === "unity-canvas" && /webgl/.test(type)) attributes = Object.assign({}, attributes, { alpha: false });
      return getContext.call(this, type, attributes);
    };

    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var fill = document.querySelector("#fill");
    var hint = document.querySelector("#hint");

    function showProgress(pct) {
      pct = Math.round(pct);
      fill.style.width = pct + "%";
      hint.textContent = "加载中 " + pct + "%　第一次打开要下载一阵，之后会快很多。请用电脑浏览器打开。";
    }

    // GitHub 单个文件上限 100MB，发布时数据文件会被切成几段（Build/<数据文件>.parts 里写着段数），
    // 这里分段下载再拼回来；没切的话直接用原文件
    function fetchParts(base, count) {
      var loaded = 0, total = 0;
      var parts = [];
      for (var i = 0; i < count; i++) parts.push(i);
      return Promise.all(parts.map(function (i) {
        return fetch(base + ".part" + i).then(function (response) {
          if (!response.ok) throw new Error("下载失败（" + response.status + "）");
          total += Number(response.headers.get("Content-Length")) || 0;
          var reader = response.body.getReader();
          var chunks = [];
          function pump() {
            return reader.read().then(function (result) {
              if (result.done) return new Blob(chunks);
              chunks.push(result.value);
              loaded += result.value.length;
              if (total) showProgress(Math.min(90, loaded / total * 90));
              return pump();
            });
          }
          return pump();
        });
      })).then(function (blobs) {
        return URL.createObjectURL(new Blob(blobs));
      });
    }

    function start() {
      var script = document.createElement("script");
      script.src = buildUrl + "/web.loader.js";
      script.onload = function () {
        var base = config.dataUrl.indexOf("blob:") === 0 ? 90 : 0;
        createUnityInstance(canvas, config, function (progress) {
          showProgress(base + progress * (100 - base));
        }).then(function (instance) {
          window.unityInstance = instance;
          loading.remove();
          canvas.focus();
        }).catch(function (message) {
          hint.textContent = "加载失败：" + message;
        });
      };
      document.body.appendChild(script);
    }

    var dataBase = buildUrl + "/web.data.unityweb";
    fetch(dataBase + ".parts", { cache: "no-cache" })
      .then(function (response) { return response.ok ? response.text() : null; })
      .catch(function () { return null; })
      .then(function (count) {
        if (!count) return start();
        return fetchParts(dataBase, parseInt(count, 10)).then(function (url) {
          config.dataUrl = url;
          start();
        });
      })
      .catch(function (error) {
        hint.textContent = "加载失败：" + error.message;
      });
  </script>
</body>
</html>
